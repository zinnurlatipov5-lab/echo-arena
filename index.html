<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ЭХО АРЕНЫ — батл-рояль героев</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#0b0f22;font-family:'Segoe UI',system-ui,sans-serif;color:#eef3ff}
#cv{position:fixed;inset:0;touch-action:none;display:none}
.screen{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% -10%,#26355f,#0b0f22 60%)}
.screen.show{display:flex}
.panel{background:linear-gradient(180deg,#1a2350,#0e1533);border:1px solid rgba(120,200,255,.25);border-radius:22px;padding:22px 18px;max-width:420px;width:94%;text-align:center;max-height:94vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{font-size:38px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#7ef2ff,#c07bff,#ff7bd0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12.5px;opacity:.75;margin:6px 0 14px}
.gname{width:100%;max-width:260px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.25);color:#eef3ff;border-radius:12px;padding:11px;font-size:15px;font-family:inherit;text-align:center}
.gbtn{padding:12px 22px;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#7ef2ff,#3aa0ff);color:#04162e}
.gbtn.gold{background:linear-gradient(135deg,#ffd86b,#ff9a3d);color:#402a00}
.gbtn:disabled{filter:grayscale(.8);opacity:.5}
.modeRow{display:flex;gap:8px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}
.modeB{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 14px;font-size:13px;font-weight:800;cursor:pointer}
.modeB.on{background:linear-gradient(135deg,#c07bff,#7b2fc0);border-color:transparent;color:#fff}
.heroGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;width:100%}
.heroB{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.18);border-radius:16px;padding:10px 4px;cursor:pointer;position:relative}
.heroB.on{border-color:#7ef2ff;background:rgba(90,220,255,.14);box-shadow:0 0 16px rgba(90,220,255,.35)}
.heroB .av{width:54px;height:54px;margin:0 auto;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 0 12px var(--gl)}
.heroB .nm{font-size:12px;font-weight:800;margin-top:5px}
.heroB .wp{font-size:10px;opacity:.75;line-height:1.2;margin-top:2px}
.heroB.lock{filter:grayscale(.9);opacity:.45}
.stat{font-size:13px;font-weight:800;color:#ffd86b}
.res{text-align:left;font-size:13px;line-height:1.65;margin:8px 0}
.res b{color:#7ef2ff}
.tiny{font-size:11px;opacity:.7;line-height:1.5}
.spin{width:44px;height:44px;border:4px solid rgba(126,242,255,.25);border-top-color:#7ef2ff;border-radius:50%;animation:sp 1s linear infinite;margin:14px auto}
@keyframes sp{to{transform:rotate(360deg)}}
#lobbyInfo{font-size:14px;font-weight:800;margin:10px 0}
.codeBox{font-size:22px;font-weight:900;letter-spacing:3px;color:#7ef2ff;background:rgba(255,255,255,.08);border-radius:12px;padding:8px;display:inline-block;margin:4px 0}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
.bars{position:absolute;left:10px;top:10px;width:min(46vw,240px)}
.hpbar{height:14px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.25);border-radius:8px;overflow:hidden}
.hpfill{height:100%;width:100%;background:linear-gradient(90deg,#2ee38b,#12a06a)}
.shbar{height:5px;margin-top:3px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden}
.shfill{height:100%;width:0;background:#59a6ff}
.wtag{font-size:12px;font-weight:700;margin-top:3px;text-shadow:0 1px 2px #000}
#topMid{position:absolute;top:8px;left:50%;transform:translateX(-50%);text-align:center;font-size:13px;font-weight:800;text-shadow:0 1px 3px #000;white-space:nowrap}
#mini{position:absolute;right:10px;top:10px;border:1px solid rgba(255,255,255,.3);border-radius:8px;background:rgba(6,10,26,.55)}
#feed{position:absolute;right:10px;top:114px;text-align:right;font-size:11.5px;font-weight:600}
#feed div{background:rgba(0,0,0,.45);border-radius:8px;padding:2px 8px;margin-top:3px}
#feed .me{color:#ffd86b}
.joy{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.25);pointer-events:auto;z-index:12}
#joyL{left:18px;bottom:24px}#joyR{right:18px;bottom:24px}
.knob{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.28);left:34px;top:34px}
.acts{position:absolute;right:16px;bottom:170px;display:flex;flex-direction:column;gap:10px;pointer-events:auto;z-index:12}
.abtn{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.4);font-size:24px;background:rgba(20,30,60,.75);color:#fff;font-weight:800}
.abtn.on{background:linear-gradient(135deg,#ffd86b,#ff9a3d);color:#402a00;box-shadow:0 0 16px rgba(255,200,90,.7)}
.abtn.cd{filter:grayscale(.85);opacity:.5}
#hint{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);z-index:14;font-size:12.5px;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:12px;opacity:0;transition:opacity .5s;pointer-events:none;text-align:center;max-width:80vw}
#revive{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);display:none;pointer-events:auto;z-index:13}
#revive button{padding:12px 22px;border-radius:14px;border:none;font-weight:800;font-size:15px;background:linear-gradient(135deg,#2ee38b,#12a06a);color:#032015}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(20,40,90,.95);border:1px solid rgba(126,242,255,.5);border-radius:14px;padding:8px 16px;font-size:13.5px;font-weight:700;animation:tup 2.2s ease forwards}
@keyframes tup{0%{opacity:0;transform:translateY(10px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

/* ---------- ЛОББИ В СТИЛЕ БРАВЛА ---------- */
.lobby{width:100%;max-width:480px;height:96vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#1b2a5e 0%,#141a3f 40%,#0d1130 100%);border-radius:26px;border:1px solid rgba(140,120,255,.35);box-shadow:0 24px 70px rgba(0,0,0,.6);overflow:hidden;position:relative}
.lobby::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% -20%,rgba(192,77,240,.25),transparent 60%);pointer-events:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(8,12,32,.65);border-bottom:1px solid rgba(140,120,255,.25);position:relative;z-index:2}
.pinfo{display:flex;align-items:center;gap:10px;cursor:pointer}
.pav{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#c07bff,#5b2fc0);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 12px rgba(192,77,240,.6);border:2px solid rgba(255,255,255,.3)}
.pnm{font-size:14px;font-weight:900}
.plg{font-size:11px;color:#ffd86b;font-weight:700}
.pcur{font-size:15px;font-weight:900;color:#c07bff;background:rgba(0,0,0,.35);padding:6px 12px;border-radius:12px;border:1px solid rgba(192,77,240,.4)}
.tabs{display:flex;gap:6px;padding:10px 12px 4px;position:relative;z-index:2}
.tabB{flex:1;padding:10px 4px;text-align:center;font-size:12.5px;font-weight:900;border-radius:12px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);cursor:pointer;letter-spacing:.5px}
.tabB.on{background:linear-gradient(135deg,#7b2fc0,#c07bff);border-color:transparent;box-shadow:0 0 14px rgba(192,77,240,.5)}
.tabpage{flex:1;overflow-y:auto;padding:8px 14px 14px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:2}
.showcase{margin:6px 0 4px;text-align:center;padding:16px 12px 14px;border-radius:20px;background:radial-gradient(circle at 50% 30%,rgba(192,77,240,.25),rgba(0,0,0,.25));border:1px solid rgba(192,77,240,.35);width:100%}
.bigav{width:112px;height:112px;margin:0 auto;border-radius:50%;font-size:54px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#fff 0%,var(--g1) 45%,var(--g2) 100%);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 26px var(--gl);border:3px solid rgba(255,255,255,.35);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05)}}
.bignm{font-size:22px;font-weight:900;margin-top:8px;letter-spacing:1px}
.bigrar{font-size:11px;font-weight:900;letter-spacing:1px}
.bigwp{font-size:12px;opacity:.8;margin-top:2px}
.bigplay{width:100%;max-width:320px;padding:18px;font-size:22px;letter-spacing:2px;border-radius:18px;box-shadow:0 8px 0 #a35f00,0 14px 30px rgba(0,0,0,.5);margin-top:12px;transition:transform .08s,box-shadow .08s}
.bigplay:active{transform:translateY(5px);box-shadow:0 3px 0 #a35f00,0 6px 14px rgba(0,0,0,.5)}
.heroB .rarity{position:absolute;top:5px;right:7px;font-size:9px;font-weight:900;padding:2px 6px;border-radius:8px;background:rgba(0,0,0,.45)}
.shopsoon{margin:auto;font-size:14px;opacity:.75;text-align:center;line-height:1.7}
</style>
</head>
<body>

<!-- ЭКРАН: ГЛАВНОЕ МЕНЮ (лобби в стиле Бравла) -->
<div class="screen show" id="scrMenu"><div class="lobby">
 <div class="topbar">
  <div class="pinfo" id="pinfo">
   <div class="pav" id="pav">🔥</div>
   <div><div class="pnm" id="pnm">Боец</div><div class="plg" id="plg">🥉 Медь</div></div>
  </div>
  <div class="pcur">🏆 <span id="curT">0</span></div>
 </div>
 <div class="tabs">
  <div class="tabB on" data-tab="tabHome">🎯 ГЛАВНАЯ</div>
  <div class="tabB" data-tab="tabHeroes">🦸 ГЕРОИ</div>
  <div class="tabB" data-tab="tabShop">🛒 МАГАЗИН</div>
 </div>
 <div class="tabpage" id="tabHome">
  <div class="showcase">
   <div class="bigav" id="bigav">🔥</div>
   <div class="bignm" id="bignm">Клык</div>
   <div class="bigrar" id="bigrar"></div>
   <div class="bigwp" id="bigwp"></div>
  </div>
  <div class="modeRow">
   <div class="modeB on" data-mode="solo">1 × 12</div>
   <div class="modeB" data-mode="duo">Дуо ×12</div>
   <div class="modeB" data-mode="squad">Отряды 4×4</div>
   <div class="modeB" data-mode="train">Тренировка</div>
  </div>
  <button class="gbtn gold bigplay" id="bPlay">В БОЙ ▶</button>
  <div class="tiny" style="margin-top:10px;text-align:center">Оружие своё у каждого героя — меняй только героя 💪</div>
 </div>
 <div class="tabpage" id="tabHeroes" style="display:none">
  <div class="heroGrid" id="heroGrid"></div>
  <div class="tiny" id="heroInfo" style="text-align:center;margin-top:6px"></div>
 </div>
 <div class="tabpage" id="tabShop" style="display:none">
  <div class="shopsoon">🛒 Магазин откроется в следующем обновлении<br>Там появятся скины героев и сундуки</div>
 </div>
</div></div>

<!-- ЭКРАН: ПОИСК МАТЧА -->
<div class="screen" id="scrLobby"><div class="panel">
 <div class="logo" style="font-size:24px">ПОИСК БОЯ</div>
 <div class="spin"></div>
 <div id="lobbyInfo">Ищем бойцов…</div>
 <div id="lobbyCode" style="display:none"><div class="tiny">Друзьям скажи код комнаты:</div><div class="codeBox" id="codeVal">—</div></div>
 <div class="tiny" id="lobbyPlayers"></div>
 <button class="gbtn" id="bLobbyOut" style="margin-top:12px">Отмена</button>
</div></div>

<!-- ЭКРАН: ИТОГИ -->
<div class="screen" id="scrEnd"><div class="panel">
 <h2 id="endT" style="font-size:26px;color:#7ef2ff">Матч завершён</h2>
 <div class="res" id="endRes" style="text-align:center"></div>
 <button class="gbtn gold" id="bAgain" style="width:100%">ЕЩЁ МАТЧ ▶</button>
 <button class="gbtn" id="bMenu" style="width:100%;margin-top:6px;background:linear-gradient(135deg,#3aa0ff,#2f5fe0);color:#eaf3ff">В МЕНЮ</button>
</div></div>

<canvas id="cv"></canvas>
<div id="hud">
 <div class="bars">
  <div class="hpbar"><div class="hpfill" id="hpF"></div></div>
  <div class="shbar"><div class="shfill" id="shF"></div></div>
  <div class="wtag" id="wTag"></div>
  <div style="height:8px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);border-radius:6px;overflow:hidden;margin-top:3px"><div id="ultfill" style="height:100%;width:0;background:linear-gradient(90deg,#ffd86b,#ff5ce0)"></div></div>
 </div>
 <div id="topMid"></div>
 <canvas id="mini" width="96" height="96"></canvas>
 <div id="feed"></div>
</div>
<div class="joy" id="joyL"><div class="knob" id="knobL"></div></div>
<div class="joy" id="joyR"><div class="knob" id="knobR"></div></div>
<div class="acts">
 <button class="abtn" id="bDash">💨</button>
 <button class="abtn" id="bFire">🎯</button>
 <button class="abtn" id="bUlt">⚡</button>
</div>
<div id="revive"><button id="bRevive">🤝 Поднять напарника (держи)</button></div>
<div id="hint"></div>
<div id="toast"></div>

<script>
'use strict';
/* ============================================================
   ЭХО АРЕНЫ · ЧАСТЬ 1: каркас, профиль, герои, матчмейкинг
   ============================================================ */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;const h=$('toast');if(!h)return;h.appendChild(d);setTimeout(()=>d.remove(),2200);}

const SUPA_CFG={url:'https://clxewmkuntmgtbovrgqk.supabase.co',key:'sb_publishable_LwCY23gqbFpUpJGhpXTlKQ_anyBHyHX'};
let SB=null;
try{SB=window.supabase.createClient(SUPA_CFG.url,SUPA_CFG.key);}catch(e){SB=null;}

const HEROES=[
 {k:'klyk',n:'Клык',r:'Штурмовик',g1:'#ff9a3d',g2:'#d03a3a',gl:'rgba(255,120,60,.6)',ic:'🔥',
  wpn:{n:'Дробовик «Клык»',dmg:13,rate:700,spd:560,rng:330,cnt:4,spread:.28},
  ab:{n:'Рывок-таран',cd:5},ult:{n:'Берсерк',d:'урон ×2, 5 сек'}},
 {k:'mira',n:'Мира',r:'Целитель',g1:'#7ee8a2',g2:'#1c7a44',gl:'rgba(90,230,150,.6)',ic:'💚',
  wpn:{n:'Снаряды «Жизнь»',dmg:10,rate:520,spd:600,rng:560,cnt:1,heal:14},
  ab:{n:'Круг восстановления',cd:7},ult:{n:'Поле жизни',d:'зона неуязвимости, 4 сек'}},
 {k:'askold',n:'Аскольд',r:'Танк',g1:'#8fc4ff',g2:'#1d4fc0',gl:'rgba(100,160,255,.6)',ic:'🛡',
  wpn:{n:'Молот «Стена»',melee:true,dmg:22,rate:640,rng:70,arc:1.2},
  ab:{n:'Барьер-щит',cd:8},ult:{n:'Непробиваемый',d:'отражает снаряды, 4 сек'}},
 {k:'yula',n:'Юла',r:'Скаут',g1:'#ffb0d0',g2:'#b03570',gl:'rgba(255,140,200,.6)',ic:'🌀',
  wpn:{n:'Пистолет «Вертушка»',dmg:7,rate:120,spd:660,rng:520,cnt:1},
  ab:{n:'Тихий прыжок',cd:6},ult:{n:'Тени',d:'телепорт к врагу'}},
 {k:'groza',n:'Гроза',r:'Снайпер',g1:'#ffd86b',g2:'#b07a1a',gl:'rgba(255,210,90,.6)',ic:'⚡',
  wpn:{n:'Винтовка «Разряд»',dmg:34,rate:1300,spd:1000,rng:1000,cnt:1,slow:2},
  ab:{n:'Заряженный выстрел',cd:9},ult:{n:'Ливень',d:'залп по площади'}},
 {k:'noktis',n:'Ноктис',r:'Хитран',g1:'#c9b0ff',g2:'#5b2fc0',gl:'rgba(170,120,255,.6)',ic:'🌙',
  wpn:{n:'Арбалет «Шёпот»',dmg:16,rate:420,spd:780,rng:640,cnt:1},
  ab:{n:'Дым-завеса',cd:8},ult:{n:'Час призрака',d:'отряд невидим, 3 сек'}}
];
const MODES={
 solo:{cap:12,teamSize:1,label:'Одиночный ×12'},
 duo:{cap:12,teamSize:2,label:'Дуо ×12'},
 squad:{cap:12,teamSize:4,label:'Отряды 4×4'},
 train:{cap:12,teamSize:1,label:'Тренировка (боты)'}
};
let MODE='solo',HERO='klyk';

let PROFILE={name:'',trophies:0,wins:0,matches:0};
try{PROFILE=Object.assign(PROFILE,JSON.parse(localStorage.getItem('eho_profile')||'{}'));}catch(e){}
function saveProfile(){localStorage.setItem('eho_profile',JSON.stringify(PROFILE));}
const ligaOf=t=>t<50?'🥉 Медь':t<120?'🥈 Бронза':t<250?'🥇 Серебро':t<500?'🏆 Золото':t<900?'💠 Платина':t<1500?'💎 Алмаз':'👑 Легенда';
function renderProfile(){$('profStat').textContent='🏆 '+PROFILE.trophies+' · '+ligaOf(PROFILE.trophies);}
renderProfile();

function showScr(id){
 ['scrMenu','scrLobby','scrEnd'].forEach(s=>$(s).classList.remove('show'));
 if(id)$(id).classList.add('show');
}
let heroUnlocked={klyk:true,mira:true,askold:true,yula:true,groza:true,noktis:true};
try{heroUnlocked=Object.assign(heroUnlocked,JSON.parse(localStorage.getItem('eho_heroes')||'{}'));}catch(e){}
function saveHeroes(){localStorage.setItem('eho_heroes',JSON.stringify(heroUnlocked));}
function renderHeroes(){
 $('heroGrid').innerHTML=HEROES.map(h=>
  '<div class="heroB'+(h.k===HERO?' on':'')+(heroUnlocked[h.k]?'':' lock')+'" data-k="'+h.k+'">'+
  '<div class="av" style="--g1:'+h.g1+';--g2:'+h.g2+';--gl:'+h.gl+'">'+h.ic+'</div>'+
  '<div class="nm">'+h.n+'</div><div class="wp">'+h.wpn.n+'</div></div>').join('');
 const h=HEROES.find(x=>x.k===HERO);
 $('heroInfo').innerHTML='<b>'+h.n+'</b> ('+h.r+') · '+h.wpn.n+'<br>Умение: '+h.ab.n+' · Ульта: '+h.ult.n+' — '+h.ult.d;
 document.querySelectorAll('.heroB').forEach(b=>b.onclick=()=>{
  const k=b.dataset.k;
  if(!heroUnlocked[k]){toast('🔒 Герой ещё закрыт');return;}
  HERO=k;renderHeroes();
 });
}
renderHeroes();
document.querySelectorAll('.modeB').forEach(b=>b.onclick=()=>{
 MODE=b.dataset.mode;
 document.querySelectorAll('.modeB').forEach(x=>x.classList.toggle('on',x===b));
});

const MM={matchId:null,isHost:false,players:[],team:0,mode:null,ch:null,pollTimer:null,started:false};
function myName(){return PROFILE.name?PROFILE.name.slice(0,12):'Боец';}

function openLobbySearch(){
 MM.mode=MODE;MM.started=false;MM.players=[];MM.team=0;
 if(MODE==='train'){startTraining();return;}
 if(!SB){toast('⚠️ Сеть недоступна — сыграем тренировку');startTraining();return;}
 showScr('scrLobby');
 $('lobbyCode').style.display='none';
 $('lobbyInfo').textContent='Ищем бойцов…';
 lobbyTick();
}
async function lobbyTick(){
 if(MM.started)return;
 try{
  const rp=await SB.from('eho_matches').select('*').eq('status','playing').limit(20);
  const mine=(rp.data||[]).find(m=>(m.players||[]).some(p=>p.pid===PROFILE.pid));
  if(mine){
   MM.matchId=mine.id;MM.isHost=mine.host_id===PROFILE.pid;
   beginNetworkMatch({matchId:mine.id,players:mine.players,mode:mine.mode,seed:Date.now(),hostSim:!MM.isHost});
   return;
  }
  const r=await SB.from('eho_matches').select('*').eq('status','waiting').eq('mode',MM.mode).order('created_at',{ascending:true}).limit(8);
  const rows=(r.data||[]);
  let joined=null;
  for(const m of rows){
   const ps=m.players||[];
   if(ps.some(p=>p.pid===PROFILE.pid))joined=m;
   else if(ps.length<MODES[MM.mode].cap){joined=m;break;}
  }
  if(!joined){
   if(!PROFILE.pid)PROFILE.pid='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
   const ins=await SB.from('eho_matches').insert({mode:MM.mode,host_id:PROFILE.pid,status:'waiting',players:[{pid:PROFILE.pid,name:myName(),hero:HERO,ready:true}]}).select().single();
   if(ins.error){$('lobbyInfo').textContent='Ошибка сети, пробуем снова…';return;}
   joined=ins.data;
  }
  MM.matchId=joined.id;
  MM.isHost=joined.host_id===PROFILE.pid;
  if(!(joined.players||[]).some(p=>p.pid===PROFILE.pid)){
   const ps=(joined.players||[]).concat([{pid:PROFILE.pid,name:myName(),hero:HERO,ready:true}]);
   await SB.from('eho_matches').update({players:ps,updated_at:new Date().toISOString()}).eq('id',joined.id);
   joined.players=ps;
  }
  MM.players=joined.players||[];
  updateLobbyUI(joined);
  if(!MM.ch){
   MM.ch=SB.channel('match:'+MM.matchId,{config:{broadcast:{self:false}}});
   MM.ch.on('broadcast',{event:'start'},msg=>{
    if(!MM.started&&msg.payload&&msg.payload.seed!==undefined)beginNetworkMatch(msg.payload);
   }).subscribe();
  }
  const need=MODES[MM.mode].cap;
  const aliveSec=(Date.now()-new Date(joined.created_at).getTime())/1000;
  if(MM.isHost&&(MM.players.length>=need||(aliveSec>45&&MM.players.length>=2))){
   MM.started=true;
   const teamSize=MODES[MM.mode].teamSize;
   const shuffled=MM.players.slice().sort(()=>Math.random()-0.5);
   const withTeams=shuffled.map((p,i)=>Object.assign(p,{team:Math.floor(i/teamSize)}));
   const missing=need-shuffled.length;
   const bots=[];for(let i=0;i<missing;i++)bots.push({pid:'bot_'+(MM.matchId||'x').slice(0,6)+'_'+i,name:'Бот '+ri(10,99),hero:HEROES[ri(0,5)].k,team:Math.floor((shuffled.length+i)/teamSize),bot:true});
   const finalRoster=withTeams.concat(bots);
   await SB.from('eho_matches').update({status:'playing',players:finalRoster,updated_at:new Date().toISOString()}).eq('id',MM.matchId);
   if(MM.ch)MM.ch.send({type:'broadcast',event:'start',payload:{matchId:MM.matchId,players:finalRoster,mode:MM.mode,seed:Date.now(),hostSim:false}});
   beginNetworkMatch({matchId:MM.matchId,players:finalRoster,mode:MM.mode,seed:Date.now(),hostSim:true});
  }else{
   const to=setTimeout(lobbyTick,2000);MM.pollTimer=to;
  }
 }catch(e){
  $('lobbyInfo').textContent='Пробуем снова…';
  setTimeout(lobbyTick,2500);
 }
}

let ACX=null;
function sfx(fr,du,ty,vo){
 try{
  ACX=ACX||new (window.AudioContext||window.webkitAudioContext)();
  const o=ACX.createOscillator(),g=ACX.createGain();
  o.type=ty||'square';o.frequency.value=fr;
  g.gain.setValueAtTime(vo||0.04,ACX.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,ACX.currentTime+du);
  o.connect(g);g.connect(ACX.destination);
  o.start();o.stop(ACX.currentTime+du);
 }catch(e){}
}

function hitObs(x,y,r){
 for(const o of obstacles){
  if(o.t==='tree'||o.t==='fount'){if(Math.hypot(x-o.x,y-o.y)<o.r+r)return true;}
  else{const cx=clamp(x,o.x,o.x+o.w),cy=clamp(y,o.y,o.y+o.h);
   if(Math.hypot(x-cx,y-cy)<r)return true;}
 }
 return false;
}
function los(x1,y1,x2,y2){
 const d=Math.hypot(x2-x1,y2-y1),steps=Math.ceil(d/24);
 for(let i=1;i<steps;i++){const t=i/steps;
  if(hitObs(x1+(x2-x1)*t,y1+(y2-y1)*t,3))return false;}
 return true;
}
function collideFighter(f){
 f.x=clamp(f.x,26,WORLD-26);f.y=clamp(f.y,26,WORLD-26);
 for(const o of obstacles){
  if(o.t==='tree'||o.t==='fount'){
   const dx=f.x-o.x,dy=f.y-o.y,d=Math.hypot(dx,dy),m=o.r+f.r;
   if(d<m&&d>0.01){f.x=o.x+dx/d*m;f.y=o.y+dy/d*m;}
  }else{
   const cx=clamp(f.x,o.x,o.x+o.w),cy=clamp(f.y,o.y,o.y+o.h);
   const dx=f.x-cx,dy=f.y-cy,d=Math.hypot(dx,dy);
   if(d<f.r){if(d<0.01){f.y=o.y-f.r-1;continue}
    f.x=cx+dx/d*f.r;f.y=cy+dy/d*f.r;}
  }
 }
}
function genWorld(){
 obstacles=[{t:'fount',x:800,y:800,r:92}];
 for(let i=0;i<46;i++){
  let x=800,y=800,ok=false,tries=0;
  while(!ok&&tries++<60){x=rnd(70,1530);y=rnd(70,1530);
   ok=Math.hypot(x-800,y-800)>200;
   if(ok)for(const o of obstacles)if(o.t==='tree'&&Math.hypot(x-o.x,y-o.y)<80){ok=false;break;}}
  if(ok)obstacles.push({t:'tree',x:x,y:y,r:rnd(16,26)});
 }
 const kiosks=[[210,260],[1330,300],[300,1290],[1260,1310],[560,180],[1030,1420],[180,820],[1400,880],[820,220]];
 kiosks.forEach(s=>obstacles.push({t:'kiosk',x:s[0]-48,y:s[1]-32,w:96,h:64}));
 for(let i=0;i<12;i++){const a=rnd(0,TAU),d=rnd(320,680);
  obstacles.push({t:'bench',x:800+Math.cos(a)*d-24,y:800+Math.sin(a)*d-7,w:48,h:14});}
 crystals=[];
 for(let i=0;i<14;i++){
  let x=800,y=800,ok=false,tr=0;
  while(!ok&&tr++<80){x=rnd(90,1510);y=rnd(90,1510);
   ok=Math.hypot(x-800,y-800)>170&&!hitObs(x,y,28);}
  crystals.push({x:x,y:y,hp:70,max:70,dead:false});
 }
}

function fireWeapon(f,ang){
 const w=HERO_MAP[f.hero].wpn;
 if(f.fireT>0||f.down||!f.alive)return;
 f.fireT=w.rate;
 const pw=1+f.power*0.06;
 if(w.melee){
  for(const b of fighters){
   if(!b.alive||b===f||b.team===f.team)continue;
   const d=dist(f.x,f.y,b.x,b.y);
   if(d>w.rng+b.r)continue;
   let da=Math.atan2(b.y-f.y,b.x-f.x)-ang;
   da=Math.atan2(Math.sin(da),Math.cos(da));
   if(Math.abs(da)<(w.arc||1.2)/2){
    damage(b,w.dmg*pw,f);
    const kb=1-d/(w.rng+b.r);
    b.x+=Math.cos(ang)*30*kb;b.y+=Math.sin(ang)*30*kb;
   }
  }
  smashCrystalsMelee(f,ang);
  sfx(160,0.12,'triangle',0.05);
 }else{
  const cnt=w.cnt||1;
  for(let i=0;i<cnt;i++){
   const a=ang+(cnt>1?(i-(cnt-1)/2)*(w.spread||0):0)+(Math.random()-0.5)*(f.isBot?0.18:0.04);
   bullets.push({x:f.x+Math.cos(a)*22,y:f.y+Math.sin(a)*22,
    vx:Math.cos(a)*w.spd,vy:Math.sin(a)*w.spd,
    life:w.rng/w.spd,dmg:(w.dmg||10)*pw,owner:f,
    heal:w.heal?w.heal*pw:0,slow:w.slow||0,pierce:false,
    color:w.heal?'#7ee8a2':HERO_MAP[f.hero].g1});
  }
  sfx(w.heal?520:(f.hero==='groza'?220:340),0.07,'square',f.isPlayer?0.03:0.012);
 }
 events.push({x:f.x,y:f.y,t:tGame});
}
function smashCrystalsMelee(f,ang){
 for(const c of crystals){
  if(c.dead)continue;
  const d=dist(f.x,f.y,c.x,c.y);
  if(d>90)continue;
  let da=Math.atan2(c.y-f.y,c.x-f.x)-ang;
  da=Math.atan2(Math.sin(da),Math.cos(da));
  if(Math.abs(da)<1.2){c.hp-=34;if(c.hp<=0)shatterCrystal(c,f);}
 }
}

 if(!f.alive||f.down||f.ult<100)return;
 f.ult=0;const k=f.hero;

function damage(t,d,att){
 if(!t.alive||t.invulT>0)return;
 if(t.down)d*=1.5;
 if(att)d*=(1+att.power*0.06)*(att.berserkT>0?2:1)*(att.empT>0?1.15:1);
 if(t.shield>0){const a=Math.min(t.shield,d);t.shield-=a;d-=a;}
 t.hp-=d;
 events.push({x:t.x,y:t.y,t:tGame});
 if(att)att.ult=Math.min(100,att.ult+d*0.4*(att.reson?1.5:1));
 if(att&&att.isPlayer&&t.team!==att.team)sfx(520,0.05,'sine',0.03);
 if(t.isPlayer)hudDirty=true;
 if(t.hp<=0){t.hp=0;
  if(teamSize>1&&!t.down)knockdown(t);
  else finalKill(t,att);
 }
}
function knockdown(t){
 t.down=true;t.downT=20;t.revP=0;t.shield=0;
 if(t.isPlayer)toast('💀 Ты сбит! Напарник может поднять — '+Math.ceil(t.downT)+' сек');
 else if(fighters[ME]&&fighters[ME].team===t.team)toast('💀 '+t.name+' сбит — подними его!');
 sfx(200,0.3,'square',0.05);
}
function finalKill(t,att){

function botAI(f){
 let wt=0;
 return function(dt){
  wt-=dt;
  const inp={mx:0,my:0,aim:f.ang,fire:false,rev:false};
  const dStorm=dist(f.x,f.y,storm.x,storm.y);
  if(dStorm>storm.r-70){
   const d=Math.max(1,dStorm);
   inp.mx=(storm.x-f.x)/d;inp.my=(storm.y-f.y)/d;
   f.aiT=0;return inp;
  }
  let near=null,nd=1e9;
  for(const s of shards){const d=dist(f.x,f.y,s.x,s.y);if(d<nd&&d<150){nd=d;near=s;}}
  if(near){const d=Math.max(1,nd);inp.mx=(near.x-f.x)/d;inp.my=(near.y-f.y)/d;}
  const w=HERO_MAP[f.hero].wpn;
  const rng=w.melee?90:w.rng*0.9;
  const t=(f.aiTgt&&f.aiTgt.alive&&dist(f.x,f.y,f.aiTgt.x,f.aiTgt.y)<rng*1.25&&los(f.x,f.y,f.aiTgt.x,f.aiTgt.y))
   ?f.aiTgt:nearestEnemy(f,rng*1.25);
  f.aiTgt=t;
  if(t&&!f.down){
   const d=Math.max(1,dist(f.x,f.y,t.x,t.y));
   const ax=(t.x-f.x)/d,ay=(t.y-f.y)/d;
   inp.aim=Math.atan2(t.y-f.y,t.x-f.x);
   if(w.melee){
    inp.mx=ax;inp.my=ay;
    if(d<w.rng+8)inp.fire=true;
   }else{
    const des=w.rng*0.55;
    if(d>des*1.2){inp.mx=ax*0.8;inp.my=ay*0.8;}
    else if(d<des*0.55){inp.mx=-ax;inp.my=-ay;}
    else{const s2=Math.sin(tGame*2.2+(f.aiSeed||0))*0.85;inp.mx=-ay*s2;inp.my=ax*s2;}
    if(d<w.rng*0.95)inp.fire=true;
   }
   if(f.abCd<=0&&d<rng*0.8&&Math.random()<dt*2.2){
    const k=f.hero;
    if(k==='klyk'||k==='yula')INBOT(f,inp);
    else if(k==='mira'&&f.hp<60)INBOT(f,inp);
    else if(k==='askold'&&f.hp<70)INBOT(f,inp);
    else if(k==='noktis'||k==='groza')INBOT(f,inp);
   }
   if(f.ult>=100&&(f.hp<45||d<rng*0.5)&&Math.random()<dt*1.5)useUlt(f);
  }else if(!near){
   if(wt<=0){
    wt=rnd(2,4.5);
    const a=rnd(0,TAU),dd=rnd(0,Math.max(80,storm.r*0.72));
    f.aiTx=clamp(storm.x+Math.cos(a)*dd,60,1540);
    f.aiTy=clamp(storm.y+Math.sin(a)*dd,60,1540);
   }
   const d=dist(f.x,f.y,f.aiTx||800,f.aiTy||800);
   if(d>24){inp.mx=(f.aiTx-f.x)/d;inp.my=(f.aiTy-f.y)/d;}
  }
  if(teamSize>1&&Math.random()<dt*0.8){
   for(const b of fighters){
    if(b.team===f.team&&b.down&&dist(f.x,f.y,b.x,b.y)<60){inp.rev=true;break;}
   }
  }
  return inp;
 };
}
function INBOT(f,inp){
 const saveMx=inp.mx,saveMy=inp.my;
 inp.mx=0;inp.my=0;
 useAbility(f,inp);
 inp.mx=saveMx;inp.my=saveMy;
}
function nearestEnemy(f,rng){
 let best=null,bd=1e9;
 for(const o of fighters){
  if(!o.alive||o.team===f.team)continue;
  const d=dist(f.x,f.y,o.x,o.y);
  if(d<bd&&d<=rng&&los(f.x,f.y,o.x,o.y)){bd=d;best=o;}
 }
 return best;
}

function bindJoy(el,knob){
 let jid=null,cx=0,cy=0;
 const R=46;
 el.addEventListener('touchstart',e=>{
  const t=e.changedTouches[0];jid=t.identifier;
  const r=el.getBoundingClientRect();
  cx=r.left+60;cy=r.top+60;mv(t);e.preventDefault();
 },{passive:false});
 el.addEventListener('touchmove',e=>{
  for(const t of e.changedTouches)if(t.identifier===jid)mv(t);
  e.preventDefault();
 },{passive:false});
 const end=e=>{
  for(const t of e.changedTouches)if(t.identifier===jid){
   jid=null;knob.style.left='34px';knob.style.top='34px';
   if(el.id==='joyL'){IN.mx=0;IN.my=0;}else{IN.aim=null;IN.fire=false;}
  }
 };
 el.addEventListener('touchend',end);el.addEventListener('touchcancel',end);
 function mv(t){
  let nx=t.clientX-cx,ny=t.clientY-cy;
  const d=Math.hypot(nx,ny);
  if(d>R){nx=nx/d*R;ny=ny/d*R;}
  knob.style.left=(34+nx)+'px';knob.style.top=(34+ny)+'px';
  if(el.id==='joyL'){IN.mx=nx/R;IN.my=ny/R;}
  else{IN.aim=Math.atan2(ny,nx);IN.fire=true;}
 }
}
bindJoy($('joyL'),$('knobL'));
bindJoy($('joyR'),$('knobR'));

function netStep(dt){
 if(ST!=='play'||over)return;
 if(amHost||isTrain){
  for(const f of fighters){
   if(!f.alive)continue;
   if(f.isPlayer){
    if(IN.abTap){useAbility(f,IN);IN.abTap=false;}
    if(IN.ultTap){useUlt(f);IN.ultTap=false;}
    if(IN.fire)assistAim(f);
    updFighterSim(f,{mx:IN.mx,my:IN.my,aim:IN.aim,fire:IN.fire,rev:IN.rev},dt);
   }else if(f.ai){
    updFighterSim(f,f.ai(dt),dt);
   }else if(f.netIn){
    if(f.abTapReq){useAbility(f,f.netIn);f.abTapReq=false;}
    if(f.ultTapReq){useUlt(f);f.ultTapReq=false;}
    if(f.netIn.fire)assistAim(f);
    updFighterSim(f,f.netIn,dt);
   }
  }
  if(GHOST){
   updGhost(dt);
   if(IN.abTap){ghostPulse();IN.abTap=false;}
  }
  for(const f of fighters){
   if(f.down){f.downT-=dt;
    if(f.downT<=0)finalKill(f,null);}
  }
  updBullets(dt);updShards(dt);updZones(dt);updAirdrops(dt);updHeart(dt);updStorm(dt);
  checkEnd();
  if(!isTrain)hostSendSnapshot();
 }else{
  for(const f of fighters){
   if(f.netX===undefined)continue;
   const k=Math.min(1,dt*14);
   f.x+=(f.netX-f.x)*k;f.y+=(f.netY-f.y)*k;
   if(f.netA!==undefined)f.ang=f.netA;
  }
  if(GHOST&&!fighters[ME].alive)updGhost(dt);
  const me=fighters[ME];
  if(me&&me.alive&&!me.down){
   const mv=Math.hypot(IN.mx,IN.my);
   if(mv>0.05){
    const nx=IN.mx/Math.max(1,mv),ny=IN.my/Math.max(1,mv);
    me.x=clamp(me.x+nx*me.speed*dt,26,WORLD-26);
    me.y=clamp(me.y+ny*me.speed*dt,26,WORLD-26);
   }
  }
 }
}

function drawFighter(f){
 const h=HERO_MAP[f.hero];
 const rel=f.isPlayer?'me':(fighters[ME]&&f.team===fighters[ME].team?'ally':'enemy');
 const ringC=rel==='me'?'#2ee38b':(rel==='ally'?'#59a6ff':'#ff6b6b');
 const R=f.r;
 const walk=Math.sin(tGame*9+(f.pid||'').length*2.1);
 const bob=f.dashT>0?0:walk*2.2;
 const sq=f.dashT>0?0.86:1+Math.abs(walk)*0.05;

 ctx.save();
 ctx.translate(f.x,f.y+R*0.8);
 const gr=ctx.createRadialGradient(0,2,2,0,2,R*1.6);
 gr.addColorStop(0,'rgba(0,0,0,.4)');gr.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=gr;
 ctx.beginPath();ctx.ellipse(0,2,R*1.6,R*0.6,0,0,TAU);ctx.fill();
 ctx.restore();

 ctx.save();
 ctx.translate(f.x,f.y+bob);
 if(f.invisT>0)ctx.globalAlpha=0.35;

 ctx.strokeStyle=ringC;ctx.lineWidth=rel==='me'?3:2;
 ctx.beginPath();ctx.ellipse(0,R*1.25,R*1.12,R*0.42,0,0,TAU);ctx.stroke();

 if(f.down){
  ctx.globalAlpha=0.75;
  ctx.save();ctx.rotate(0.4);
  ctx.fillStyle=h.g2;
  ctx.beginPath();ctx.ellipse(0,R*0.3,R*1.15,R*0.7,0,0,TAU);ctx.fill();
  ctx.fillStyle=h.g1;
  ctx.beginPath();ctx.ellipse(0,R*0.2,R*0.95,R*0.55,0,0,TAU);ctx.fill();
  ctx.strokeStyle='#1a2030';ctx.lineWidth=2;
  for(const sx of[-R*0.4,R*0.15]){
   ctx.beginPath();
   ctx.moveTo(sx-4,R*0.1);ctx.lineTo(sx+4,R*0.28);
   ctx.moveTo(sx+4,R*0.1);ctx.lineTo(sx-4,R*0.28);
   ctx.stroke();
  }
  ctx.restore();
  if(f.revP>0){
   ctx.strokeStyle='#2ee38b';ctx.lineWidth=4;
   ctx.beginPath();ctx.arc(0,0,R+10,-Math.PI/2,-Math.PI/2+f.revP*TAU);ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillStyle=ringC;ctx.fillText(f.name,0,-R*1.7);
  ctx.restore();return;
 }

 const body=ctx.createRadialGradient(-R*0.35,-R*0.45,R*0.15,0,0,R*1.15);
 body.addColorStop(0,'#ffffff');
 body.addColorStop(0.55,h.g1);
 body.addColorStop(1,h.g2);
 ctx.fillStyle=body;
 ctx.beginPath();ctx.ellipse(0,sq*R*0.1,R,R*sq,0,0,TAU);ctx.fill();

 ctx.fillStyle='rgba(0,0,0,.28)';
 ctx.beginPath();ctx.ellipse(0,R*0.55,R*0.82,R*0.34,0,0,Math.PI);ctx.fill();

 ctx.fillStyle='rgba(255,255,255,.45)';
 ctx.beginPath();ctx.ellipse(-R*0.3,-R*0.42,R*0.42,R*0.3,-0.5,0,TAU);ctx.fill();

 ctx.fillStyle=h.g2;
 ctx.beginPath();ctx.ellipse(0,-R*0.62,R*0.72,R*0.42,0,Math.PI,0,false);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.25)';
 ctx.beginPath();ctx.ellipse(-R*0.25,-R*0.75,R*0.3,R*0.16,-0.3,0,TAU);ctx.fill();

 const ex=Math.cos(f.ang)*R*0.28,ey=Math.sin(f.ang)*R*0.22;
 ctx.fillStyle='#fff';
 ctx.beginPath();ctx.ellipse(-R*0.22+ex*0.6,-R*0.12+ey*0.5,R*0.2,R*0.24,0,0,TAU);ctx.fill();
 ctx.beginPath();ctx.ellipse(R*0.22+ex*0.6,-R*0.12+ey*0.5,R*0.2,R*0.24,0,0,TAU);ctx.fill();
 ctx.fillStyle='#1a2030';
 ctx.beginPath();ctx.arc(-R*0.22+ex,-R*0.12+ey,R*0.1,0,TAU);ctx.fill();
 ctx.beginPath();ctx.arc(R*0.22+ex,-R*0.12+ey,R*0.1,0,TAU);ctx.fill();

 if(f.berserkT>0){
  ctx.strokeStyle='rgba(255,90,40,.85)';ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(0,0,R+8+Math.sin(tGame*12)*3,0,TAU);ctx.stroke();
 }
 if(f.reflectT>0){ctx.strokeStyle='rgba(255,216,107,.95)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,R+6,0,TAU);ctx.stroke();}
 if(f.shield>0){ctx.strokeStyle='rgba(90,170,255,.9)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,R+4,0,TAU);ctx.stroke();}
 if(f.reson){ctx.strokeStyle='rgba(210,77,240,'+(0.5+0.5*Math.sin(tGame*7)).toFixed(2)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,R+11,0,TAU);ctx.stroke();}

 const wpn=HERO_MAP[f.hero].wpn;
 ctx.save();ctx.rotate(f.ang);
 if(wpn.melee){
  ctx.fillStyle='#6b4a2a';ctx.fillRect(R*0.5,-R*0.12,R*0.9,R*0.24);
  ctx.fillStyle='#9aa7b8';rr(ctx,R*1.2,-R*0.5,R*0.55,R*1.0,R*0.18);
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(R*1.24,-R*0.46,R*0.14,R*0.9);
 }else{
  ctx.fillStyle='#20293c';
  rr(ctx,R*0.7,-R*0.14,R*(f.hero==='groza'?1.15:0.85),R*0.28,R*0.1);
  ctx.fillStyle=h.g1;
  rr(ctx,R*0.7,-R*0.16,R*0.28,R*0.32,R*0.08);
  if(f.fireT>wpn.rate-60){
   ctx.fillStyle='rgba(255,220,120,.9)';
   ctx.beginPath();ctx.arc(R*(f.hero==='groza'?2.0:1.7),0,R*0.35,0,TAU);ctx.fill();
  }
 }
 ctx.restore();

 ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
 ctx.fillStyle='rgba(0,0,0,.6)';
 ctx.fillText(f.name,1,-R*2.15);
 ctx.fillStyle=ringC;
 ctx.fillText(f.name,0,-R*2.2);
 const bw=40,bh=6,bx=-bw/2,by=-R*1.85;
 ctx.fillStyle='rgba(0,0,0,.65)';rr(ctx,bx-1,by-1,bw+2,bh+2,3);
 ctx.fillStyle='#232b40';rr(ctx,bx,by,bw,bh,2.5);
 ctx.fillStyle=ringC;
 rr(ctx,bx,by,bw*clamp(f.hp/f.maxhp,0,1),bh,2.5);
 if(f.shield>0){
  ctx.fillStyle='rgba(90,170,255,.9)';
  rr(ctx,bx,by-2.5,bw*clamp(f.shield/160,0,1),2.5,1.2);
 }
 ctx.restore();
}

const mcv=$('mini'),mctx=mcv.getContext('2d');
function drawMini(){
 mctx.clearRect(0,0,96,96);
 const s=96/WORLD;
 mctx.fillStyle='rgba(20,40,30,.9)';mctx.fillRect(0,0,96,96);
 mctx.strokeStyle='#d060f0';mctx.lineWidth=1.5;
 mctx.beginPath();mctx.arc(storm.x*s,storm.y*s,storm.r*s,0,TAU);mctx.stroke();
 for(const c of crystals)if(!c.dead){mctx.fillStyle='#c07bff';mctx.fillRect(c.x*s-1,c.y*s-1,2,2);}
 for(const c of crates2){mctx.fillStyle='#ffd86b';mctx.fillRect(c.x*s-1.5,c.y*s-1.5,3,3);}
 const me=fighters[ME];
 for(const f of fighters){
  if(!f.alive)continue;
  const rel=f.isPlayer?'me':(me&&f.team===me.team?'ally':'enemy');
  mctx.fillStyle=rel==='me'?'#2ee38b':(rel==='ally'?'#59a6ff':'#ff8080');
  mctx.beginPath();mctx.arc(f.x*s,f.y*s,rel==='me'?3:2,0,TAU);mctx.fill();
 }
}

/* кнопки экрана итогов */
$('bAgain').onclick=()=>{hideGame();showScr(null);openLobbySearch();};
$('bMenu').onclick=()=>{
 hideGame();ST='idle';over=false;GHOST=null;
 showScr('scrMenu');renderProfile();
};

/* главный цикл */
function loop(ts){
 requestAnimationFrame(loop);
 const dt=Math.min(0.05,(ts-lastTs)/1000||0);lastTs=ts;
 if(ST==='play'){
  readDesktopInput();
  netStep(dt);
 }
 render(dt);
 if(ST==='play'||ST==='end')updHUD();
}
requestAnimationFrame(loop);
</script>
